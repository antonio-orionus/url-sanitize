name: post-release-smoke

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, with or without leading v'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'antonio-orionus/homebrew-url-sanitize' }}
  SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'antonio-orionus/scoop-url-sanitize' }}

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6 pinned 2026-05-31.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # actions/setup-node@v6 pinned 2026-05-31.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Verify public release surfaces
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: node scripts/verify-published-release.mjs "$VERSION"

  homebrew-smoke:
    runs-on: macos-14
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'antonio-orionus/homebrew-url-sanitize' }}
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      # actions/checkout@v6 pinned 2026-05-31.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install and smoke published Homebrew formula
        run: |
          set -euo pipefail
          brew tap "$HOMEBREW_TAP_REPO"
          brew install "$HOMEBREW_TAP_REPO/url-sanitize"
          scripts/smoke-cli.sh "$(brew --prefix)/bin/url-sanitize" "${VERSION#v}"

  scoop-smoke:
    runs-on: windows-latest
    env:
      SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'antonio-orionus/scoop-url-sanitize' }}
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      # actions/checkout@v6 pinned 2026-05-31.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install and smoke published Scoop manifest
        shell: pwsh
        run: |
          $env:SCOOP = Join-Path $env:RUNNER_TEMP "scoop"
          $env:SCOOP_GLOBAL = Join-Path $env:RUNNER_TEMP "scoop-global"
          [Environment]::SetEnvironmentVariable("SCOOP", $env:SCOOP, "User")
          [Environment]::SetEnvironmentVariable("SCOOP_GLOBAL", $env:SCOOP_GLOBAL, "User")
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $env:Path = "$env:SCOOP\shims;$env:Path"
          scoop bucket add url-sanitize "https://github.com/$env:SCOOP_BUCKET_REPO"
          scoop install url-sanitize
          ./scripts/smoke-cli.ps1 -Command "url-sanitize" -ExpectedVersion ($env:VERSION -replace '^v', '')
