name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  platform-matrix:
    name: Platform Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: node scripts/release-platforms.mjs --gha-matrix >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            pnpm verify:release -- --tag "${GITHUB_REF_NAME}"
          else
            pnpm verify:release
          fi
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo package -p url-sanitize-core
      - name: Package url-sanitize archive when core dependency is published
        run: |
          version="$(python3 -c 'import json, subprocess; data=json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version=1"])); print(next(p["version"] for p in data["packages"] if p["name"] == "url-sanitize-core"))')"
          if curl -fsSA "url-sanitize-release" "https://crates.io/api/v1/crates/url-sanitize-core/${version}" >/dev/null; then
            cargo package -p url-sanitize
          else
            echo "url-sanitize-core ${version} is not on crates.io yet; skipping dependent package verification"
          fi
      - run: pnpm smoke

  build-native:
    needs: [verify, platform-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.platform-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build native binary
        run: cargo build --release -p url-sanitize --target "${{ matrix.target }}"
        shell: bash
      - name: Stage binary
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          mkdir -p "dist/${{ matrix.target }}"
          cp "$src" "dist/${{ matrix.target }}/${{ matrix.binary }}"
          chmod +x "dist/${{ matrix.target }}/${{ matrix.binary }}" || true
        shell: bash
      - name: Smoke native binary
        run: |
          set -euo pipefail
          scripts/smoke-cli.sh "dist/${{ matrix.target }}/${{ matrix.binary }}"
        shell: bash
      - name: Build release archive
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.target }}/*' -DestinationPath 'release-assets/${{ matrix.archive }}'"
          else
            tar -czf "release-assets/${{ matrix.archive }}" -C "dist/${{ matrix.target }}" .
          fi
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
  github-release:
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Add installer scripts and checksums
        run: |
          cp scripts/install.sh release-assets/url-sanitize-installer.sh
          cp scripts/install.ps1 release-assets/url-sanitize-installer.ps1
          chmod +x release-assets/url-sanitize-installer.sh
          (cd release-assets && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true

  smoke-installers:
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Smoke published Linux installer
        if: runner.os == 'Linux'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/url-sanitize-bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/antonio-orionus/url-sanitize/releases/download/${REF_NAME}/url-sanitize-installer.sh" \
            -o "$RUNNER_TEMP/url-sanitize-installer.sh"
          URL_SANITIZE_INSTALL_DIR="$install_dir" sh "$RUNNER_TEMP/url-sanitize-installer.sh"
          scripts/smoke-cli.sh "$install_dir/url-sanitize" "${REF_NAME#v}"

      - name: Smoke published Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $InstallDir = Join-Path $env:RUNNER_TEMP "url-sanitize-bin"
          $Installer = Join-Path $env:RUNNER_TEMP "url-sanitize-installer.ps1"
          Invoke-WebRequest `
            -Uri "https://github.com/antonio-orionus/url-sanitize/releases/download/$env:REF_NAME/url-sanitize-installer.ps1" `
            -OutFile $Installer
          $env:URL_SANITIZE_INSTALL_DIR = $InstallDir
          & $Installer
          ./scripts/smoke-cli.ps1 -Command (Join-Path $InstallDir "url-sanitize.exe") -ExpectedVersion ($env:REF_NAME -replace '^v', '')

  publish-package-managers:
    needs: smoke-installers
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.packaging-config.outputs.configured }}
    env:
      PACKAGING_REPO_TOKEN: ${{ secrets.PACKAGING_REPO_TOKEN }}
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'antonio-orionus/homebrew-url-sanitize' }}
      SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'antonio-orionus/scoop-url-sanitize' }}
    steps:
      - id: packaging-config
        run: |
          if [ -n "$PACKAGING_REPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if package-manager publishing is not configured
        if: env.PACKAGING_REPO_TOKEN == ''
        run: echo "PACKAGING_REPO_TOKEN is not configured; skipping Homebrew/Scoop publishing"

      - uses: actions/checkout@v6
        if: env.PACKAGING_REPO_TOKEN != ''
        with:
          path: source

      - name: Render package-manager files
        if: env.PACKAGING_REPO_TOKEN != ''
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/antonio-orionus/url-sanitize/releases/download/${GITHUB_REF_NAME}/SHA256SUMS" \
            -o "$RUNNER_TEMP/SHA256SUMS"
          node source/scripts/render-package-manager-files.mjs \
            --version "$version" \
            --sums "$RUNNER_TEMP/SHA256SUMS" \
            --out "$RUNNER_TEMP/package-managers"

      - uses: actions/checkout@v6
        if: env.PACKAGING_REPO_TOKEN != ''
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ env.PACKAGING_REPO_TOKEN }}
          path: homebrew-tap

      - uses: actions/checkout@v6
        if: env.PACKAGING_REPO_TOKEN != ''
        with:
          repository: ${{ env.SCOOP_BUCKET_REPO }}
          token: ${{ env.PACKAGING_REPO_TOKEN }}
          path: scoop-bucket

      - name: Publish Homebrew formula
        if: env.PACKAGING_REPO_TOKEN != ''
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp "$RUNNER_TEMP/package-managers/homebrew/Formula/url-sanitize.rb" homebrew-tap/Formula/url-sanitize.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/url-sanitize.rb
          if git -C homebrew-tap diff --cached --quiet -- Formula/url-sanitize.rb; then
            echo "Homebrew formula already up to date"
          else
            git -C homebrew-tap commit -m "url-sanitize ${GITHUB_REF_NAME}"
            git -C homebrew-tap push
          fi

      - name: Publish Scoop manifest
        if: env.PACKAGING_REPO_TOKEN != ''
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/package-managers/scoop/url-sanitize.json" scoop-bucket/url-sanitize.json
          git -C scoop-bucket config user.name "github-actions[bot]"
          git -C scoop-bucket config user.email "github-actions[bot]@users.noreply.github.com"
          git -C scoop-bucket add url-sanitize.json
          if git -C scoop-bucket diff --cached --quiet -- url-sanitize.json; then
            echo "Scoop manifest already up to date"
          else
            git -C scoop-bucket commit -m "url-sanitize ${GITHUB_REF_NAME}"
            git -C scoop-bucket push
          fi

  post-release-public-smoke:
    needs: [publish-npm, publish-crates, publish-pypi, publish-package-managers]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'antonio-orionus/homebrew-url-sanitize' }}
      SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'antonio-orionus/scoop-url-sanitize' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify public release surfaces
        run: node scripts/verify-published-release.mjs "${GITHUB_REF_NAME}"

  post-release-homebrew-smoke:
    needs: publish-package-managers
    if: startsWith(github.ref, 'refs/tags/') && needs.publish-package-managers.outputs.configured == 'true'
    runs-on: macos-14
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'antonio-orionus/homebrew-url-sanitize' }}
    steps:
      - uses: actions/checkout@v6
      - name: Install and smoke published Homebrew formula
        run: |
          set -euo pipefail
          brew tap "$HOMEBREW_TAP_REPO"
          brew install "$HOMEBREW_TAP_REPO/url-sanitize"
          scripts/smoke-cli.sh "$(brew --prefix)/bin/url-sanitize" "${GITHUB_REF_NAME#v}"

  post-release-scoop-smoke:
    needs: publish-package-managers
    if: startsWith(github.ref, 'refs/tags/') && needs.publish-package-managers.outputs.configured == 'true'
    runs-on: windows-latest
    env:
      SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'antonio-orionus/scoop-url-sanitize' }}
    steps:
      - uses: actions/checkout@v6
      - name: Install and smoke published Scoop manifest
        shell: pwsh
        run: |
          $env:SCOOP = Join-Path $env:RUNNER_TEMP "scoop"
          $env:SCOOP_GLOBAL = Join-Path $env:RUNNER_TEMP "scoop-global"
          [Environment]::SetEnvironmentVariable("SCOOP", $env:SCOOP, "User")
          [Environment]::SetEnvironmentVariable("SCOOP_GLOBAL", $env:SCOOP_GLOBAL, "User")
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $env:Path = "$env:SCOOP\shims;$env:Path"
          scoop bucket add url-sanitize "https://github.com/$env:SCOOP_BUCKET_REPO"
          scoop install url-sanitize
          ./scripts/smoke-cli.ps1 -Command "url-sanitize" -ExpectedVersion ($env:GITHUB_REF_NAME -replace '^v', '')

  publish-npm:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g 'npm@^11.5.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish TypeScript npm packages
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          mkdir -p npm-packages

          publish_pkg() {
            pkg="$1"
            filter="$2"
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION already published; skipping"
              return
            fi
            rm -f npm-packages/*.tgz
            pnpm --filter "$filter" pack --pack-destination "$PWD/npm-packages"
            npm publish "$PWD"/npm-packages/*.tgz --access public
          }

          publish_pkg "@url-sanitize/core" "@url-sanitize/core"
          publish_pkg "@url-sanitize/clearurls" "@url-sanitize/clearurls"
          publish_pkg "@url-sanitize/cli" "@url-sanitize/cli"

  publish-crates:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Read crate version
        id: version
        run: |
          version="$(python3 -c 'import json, subprocess; data=json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version=1"])); print(next(p["version"] for p in data["packages"] if p["name"] == "url-sanitize-core"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish url-sanitize-core to crates.io
        run: |
          if curl -fsSA "url-sanitize-release" "https://crates.io/api/v1/crates/url-sanitize-core/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "url-sanitize-core ${{ steps.version.outputs.version }} already published; skipping"
          else
            cargo publish -p url-sanitize-core
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for crates.io index propagation
        run: sleep 30
      - name: Publish url-sanitize to crates.io
        run: |
          if curl -fsSA "url-sanitize-release" "https://crates.io/api/v1/crates/url-sanitize/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "url-sanitize ${{ steps.version.outputs.version }} already published; skipping"
          else
            cargo publish -p url-sanitize
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build Python package
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
