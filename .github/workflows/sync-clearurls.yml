name: sync-sources

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# The PR and its merge use SYNC_TOKEN, so GITHUB_TOKEN stays read-only while
# pnpm install, the upstream fetch and the build run third-party code.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Fetch and verify upstream rules
        run: pnpm sync:sources

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet packages/clearurls/data packages/adguard/data packages/brave/data packages/firefox/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        run: |
          CURRENT=$(node -p "require('./packages/core/package.json').version")
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          node scripts/bump-version.mjs "$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        id: bump

      # CI rejects a sync whose generated files lag the new rule data and
      # version: the merged catalogs, the Rust crate's embedded catalog, the
      # conformance corpus, and the workspace entries in Cargo.lock.
      - name: Regenerate catalogs, conformance corpus and Cargo.lock
        if: steps.diff.outputs.changed == 'true'
        run: |
          pnpm build
          pnpm build:catalog
          pnpm build:conformance
          cargo update --workspace

      # The PR and its auto-merge use SYNC_TOKEN, not GITHUB_TOKEN. Checks on a
      # PR pushed with GITHUB_TOKEN wait for manual approval, and a merge made
      # with it starts no ci run on main, so auto-tag never releases.
      - name: Require SYNC_TOKEN
        if: steps.diff.outputs.changed == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is not set; see AGENTS.md > Daily sync."
            exit 1
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          commit-message: 'release: v${{ steps.bump.outputs.new_version }}'
          title: 'chore(sources): sync upstream rules → v${{ steps.bump.outputs.new_version }}'
          body: |
            Automated daily sync of url-sanitize upstream rule catalogs:
            ClearURLs, AdGuard URL Tracking Protection, Brave Debouncer, and
            Firefox Query Stripping.
          branch: source-sync
          delete-branch: true

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
